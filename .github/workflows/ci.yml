name: CI/CD Pipeline

on:
  push:
    branches: [ main, version-3, develop ]
  pull_request:
    branches: [ main, version-3, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            cc: gcc
          - compiler: clang
            cxx: clang++
            cc: clang

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libsqlite3-dev \
          libgtest-dev \
          gnuplot \
          valgrind \
          lcov

    - name: Clean build directory
      run: rm -rf build

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      working-directory: build
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      working-directory: build
      run: make -j$(nproc)

    - name: Run tests
      working-directory: build
      run: ctest --verbose --output-on-failure

    - name: Build with coverage instrumentation (GCC only)
      if: matrix.compiler == 'gcc'
      working-directory: build
      run: |
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
        make -j$(nproc)

    - name: Run tests with coverage (GCC only)
      if: matrix.compiler == 'gcc'
      working-directory: build
      run: ctest --verbose --output-on-failure

    - name: Generate coverage report (GCC only)
      if: matrix.compiler == 'gcc'
      working-directory: build
      run: |
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
        lcov --list coverage.info
      continue-on-error: true

  lint-cpp:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy

    - name: Check code formatting
      run: |
        find . -name "*.cpp" -o -name "*.hpp" | \
        grep -v build | grep -v node_modules | \
        xargs clang-format --dry-run --Werror
      continue-on-error: true

    - name: Run clang-tidy
      run: |
        mkdir -p build && cd build
        sudo apt-get install -y cmake libsqlite3-dev libgtest-dev
        cmake ..
        run-clang-tidy -header-filter=hpp/ -checks='readability-*,performance-*' ..
      continue-on-error: true

  tui-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install TUI dependencies
      working-directory: tui
      run: npm ci

    - name: Build TypeScript
      working-directory: tui
      run: npm run build

    - name: Type check
      working-directory: tui
      run: npx tsc --noEmit
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: multi-algo-analysis:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build development Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.dev
        push: false
        tags: multi-algo-analysis:dev
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy security scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libsqlite3-dev libgtest-dev cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance \
          --suppress=missingIncludeSystem \
          --error-exitcode=1 \
          -I hpp/ src/ hpp/
      continue-on-error: true

    - name: Configure CMake
      run: mkdir -p build && cd build && cmake ..

    - name: Build
      working-directory: build
      run: make -j$(nproc)

  release-notes:
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Generate release notes
      run: |
        echo "Release artifacts built successfully"
        echo "All tests passed - ready for production deployment"
